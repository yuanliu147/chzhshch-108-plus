<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>缠论新手学习实践手册</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --sub:#5b6b7b; --line:#e3e8ee;
  --blue:#1f6feb; --orange:#e8590c; --red:#d92d20; --green:#12805c; --amber:#b54708;
  --purple:#6941c6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 64px}
header.top{padding:26px 24px;background:linear-gradient(135deg,#0b2540,#123f63);color:#fff;border-radius:16px;margin-bottom:14px}
header.top h1{margin:0 0 8px;font-size:27px;line-height:1.35;letter-spacing:.5px}
header.top p{margin:6px 0;color:#cfe0ef;font-size:14.5px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#eaf2f9;
  padding:4px 11px;border-radius:999px;font-size:12.5px}
nav.toc{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:9px 16px}
nav.toc .row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
nav.toc a{flex:0 0 auto;text-decoration:none;color:var(--sub);background:#fff;border:1px solid var(--line);
  padding:5px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
nav.toc a:hover{border-color:var(--blue);color:var(--blue)}
.progress{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.bar{flex:1;height:6px;background:#e3e8ee;border-radius:99px;overflow:hidden;max-width:280px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
section h2{margin:0 0 4px;font-size:21px;line-height:1.4;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gate{flex:0 0 auto;background:#0b2540;color:#fff;font-size:12.5px;padding:3px 10px;border-radius:7px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--sub);font-size:14px;margin:0 0 16px}
h3{font-size:16.5px;margin:22px 0 8px;padding-left:10px;border-left:3px solid var(--blue)}
h4{font-size:15px;margin:16px 0 6px}
p{margin:9px 0}
a{color:var(--blue)}
.src{display:inline-block;font-size:11.5px;color:var(--sub);background:#f2f5f8;border:1px solid var(--line);
  border-radius:5px;padding:0 6px;margin-left:5px;text-decoration:none;vertical-align:1px;white-space:nowrap}
.src:hover{border-color:var(--blue);color:var(--blue)}
.def{background:#f7f9fc;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 16px;margin:12px 0}
.def .lab{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.def p{margin:4px 0}
.box{border-radius:10px;padding:12px 16px;margin:12px 0;border:1px solid}
.box .lab{font-size:12.5px;font-weight:700;letter-spacing:.6px;margin-bottom:5px;display:block}
.box p{margin:5px 0}
.confirm{background:#fffaeb;border-color:#fedf89}.confirm .lab{color:var(--amber)}
.practice{background:#ecfdf3;border-color:#a6f4c5}.practice .lab{color:var(--green)}
.trap{background:#fef3f2;border-color:#fecdca}.trap .lab{color:var(--red)}
.note{background:#f8f9fc;border-color:var(--line)}.note .lab{color:var(--sub)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
ol.steps>li{counter-increment:s;position:relative;padding:7px 0 7px 38px;border-bottom:1px dashed var(--line)}
ol.steps>li:last-child{border-bottom:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:8px;width:25px;height:25px;border-radius:50%;
  background:#0b2540;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ul.tight{margin:8px 0;padding-left:22px}ul.tight li{margin:5px 0}
figure{margin:16px 0;padding:0}
.figscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 4px}
.figscroll svg{display:block;width:100%;min-width:680px;height:auto}
figcaption{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.65}
.hint{font-size:12px;color:var(--sub);margin:0 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.tablewrap{overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f7f9fc;font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:#fcfdfe}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0}
.flow span{background:#f2f5f8;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px}
.flow b{color:var(--sub);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfdfe}
.card h4{margin:0 0 6px}
.done{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.done input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.done label{cursor:pointer}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:11.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);background:#f7f9fc;color:var(--sub)}
.tag.y{background:#fffaeb;border-color:#fedf89;color:var(--amber)}
.tag.g{background:#ecfdf3;border-color:#a6f4c5;color:var(--green)}
.tag.b{background:#eff6ff;border-color:#bfdbfe;color:var(--blue)}
footer{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
kbd{background:#f2f5f8;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12.5px}
/* ---- SVG 配图样式 ---- */
svg text{font-family:inherit;fill:#344054}
svg .t{font-size:13px}
svg .ts{font-size:11.5px;fill:#667085}
svg .tb{font-size:12.5px;font-weight:700;fill:#101828}
svg .pt{font-size:14px;font-weight:700;fill:#0b2540}
svg .num{font-size:11px;fill:#98a2b3}
svg .axis{stroke:#98a2b3;stroke-width:1.1;fill:none}
svg .grid{stroke:#eef1f5;stroke-width:1}
svg .aux{stroke:#b0b7c3;stroke-width:1;stroke-dasharray:4 4;fill:none}
svg .now{stroke:#d92d20;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
svg .brk{stroke:#98a2b3;stroke-width:1.1;fill:none}
svg .frame{fill:none;stroke:#e3e8ee;stroke-width:1}
svg .k{stroke:#475467;stroke-width:5;fill:none}
svg .kcap{stroke:#475467;stroke-width:1.8}
svg .khl{stroke:#1f6feb;stroke-width:6;fill:none}
svg .knew{stroke:#1f6feb;stroke-width:6;fill:none}
svg .knewcap{stroke:#1f6feb;stroke-width:1.8}
svg .khlcap{stroke:#1f6feb;stroke-width:1.8}
svg .kbad{stroke:#d92d20;stroke-width:6;fill:none}
svg .kbadcap{stroke:#d92d20;stroke-width:1.8}
svg .kgood{stroke:#12805c;stroke-width:6;fill:none}
svg .kgoodcap{stroke:#12805c;stroke-width:1.8}
svg .fs{stroke:#6941c6;stroke-width:6;fill:none}
svg .fscap{stroke:#6941c6;stroke-width:1.8}
svg .fshl{stroke:#d92d20;stroke-width:6.5;fill:none}
svg .fshlcap{stroke:#d92d20;stroke-width:1.8}
svg .path{fill:none;stroke:#667085;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .bi{fill:none;stroke:#1f6feb;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
svg .seg{fill:none;stroke:#e8590c;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
svg .segA{fill:none;stroke:#1f6feb;stroke-width:3.2;stroke-linecap:round}
svg .segB{fill:none;stroke:#12805c;stroke-width:3.2;stroke-linecap:round}
svg .segC{fill:none;stroke:#d92d20;stroke-width:3.2;stroke-linecap:round}
svg .zone{fill:rgba(240,140,0,.16);stroke:#f08c00;stroke-width:1.2}
svg .out{fill:rgba(240,140,0,.06);stroke:rgba(240,140,0,.4);stroke-width:1;stroke-dasharray:4 4}
svg .ok{fill:rgba(18,128,92,.14);stroke:#12805c;stroke-width:1}
svg .gap{fill:rgba(217,45,32,.14);stroke:#d92d20;stroke-width:1;stroke-dasharray:3 3}
svg .grpA{fill:rgba(31,111,235,.09);stroke:rgba(31,111,235,.35);stroke-width:1}
svg .grpB{fill:rgba(18,128,92,.09);stroke:rgba(18,128,92,.35);stroke-width:1}
svg .future{fill:rgba(152,162,179,.13);stroke:#cbd2dc;stroke-width:1;stroke-dasharray:4 4}
svg .area{fill:rgba(105,65,198,.10);stroke:rgba(105,65,198,.4);stroke-width:1;stroke-dasharray:3 3}
svg .zgedge{stroke:#d92d20;stroke-width:1.4;stroke-dasharray:6 3;fill:none}
svg .zdedge{stroke:#12805c;stroke-width:1.4;stroke-dasharray:6 3;fill:none}
svg .ggline{stroke:#f08c00;stroke-width:1.2;stroke-dasharray:2 3;fill:none}
svg .ddline{stroke:#f08c00;stroke-width:1.2;stroke-dasharray:2 3;fill:none}
svg .toppoint{fill:#d92d20}
svg .botpoint{fill:#12805c}
svg .buypoint{fill:#d92d20;stroke:#fff;stroke-width:1.6}
svg .sellpoint{fill:#12805c;stroke:#fff;stroke-width:1.6}
svg .badpoint{fill:#98a2b3;stroke:#fff;stroke-width:1.6}
svg .segdot{fill:#e8590c;stroke:#fff;stroke-width:1.6}
svg .fsdot{fill:#6941c6}
svg .bad{stroke:#d92d20;stroke-width:2.4;fill:none}
svg .macdUp{fill:#e03131}
svg .macdDn{fill:#2f9e44}
svg .diff{fill:none;stroke:#475467;stroke-width:1.6}
svg .dea{fill:none;stroke:#f08c00;stroke-width:1.6}
svg .nest{fill:rgba(31,111,235,.13);stroke:#1f6feb;stroke-width:1.2}
svg .nestlast{fill:rgba(217,45,32,.16);stroke:#d92d20;stroke-width:1.4}
svg .stepbox{fill:#f7f9fc;stroke:#cbd2dc;stroke-width:1;rx:8}
@media print{
  body{background:#fff}nav.toc,.done,.progress{display:none}
  section{break-inside:avoid;border:0;padding:10px 0}
  .figscroll{overflow:visible;border:0}.figscroll svg{min-width:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<h1>缠论新手学习实践手册</h1>
<p>把《教你炒股票》1—108课的核心，拆成 8 个可以照着练的关卡。每关固定五件事：一句话定义、配图、判定步骤、什么时候才算确认、练什么。</p>
<p>依据本地原文整理，课号可回查。图全部是人工合成的示意，不是任何股票的行情。</p>
<div class="badges">__BADGES__</div>
</header>
<nav class="toc" aria-label="目录"><div class="row">__NAV__</div>
<div class="progress"><span id="ptext">已练完 0 / 8 关</span><span class="bar"><i id="pbar"></i></span><span>勾选会保存在本机浏览器</span></div>
</nav>
__CONTENT__
<footer>缠论新手学习实践手册 · 依据本地《教你炒股票》1—108课与5篇附文整理 · 离线单文件，可直接打印</footer>
</div>
<script>
(function(){
  var boxes=[].slice.call(document.querySelectorAll('input[data-gate]'));
  var key='chanlun-manual-progress-v1';
  var saved={};
  try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
  function paint(){
    var n=boxes.filter(function(b){return b.checked}).length;
    document.getElementById('ptext').textContent='已练完 '+n+' / '+boxes.length+' 关';
    document.getElementById('pbar').style.width=(boxes.length?n/boxes.length*100:0)+'%';
  }
  boxes.forEach(function(b){
    b.checked=!!saved[b.getAttribute('data-gate')];
    b.addEventListener('change',function(){
      saved[b.getAttribute('data-gate')]=b.checked;
      try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}
      paint();
    });
  });
  paint();
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]');
    if(!a)return;
    var el=document.getElementById(a.getAttribute('href').slice(1));
    if(!el)return;
    e.preventDefault();
    var y=el.getBoundingClientRect().top+window.pageYOffset-58;
    window.scrollTo({top:y,behavior:'smooth'});
    history.replaceState(null,'',a.getAttribute('href'));
  });
})();
</script>
</body>
</html>
